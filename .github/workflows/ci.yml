name: CI

# Runs on every push and every pull request. Nothing here touches Azure, so it
# needs no credentials and costs nothing - which is why it can run on every
# commit without anyone thinking about it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-service.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      # The agent definitions are data, not code, so nothing else would catch a
      # broken one until deploy time. Checks the JSON parses, the required keys
      # exist, and every tool named is a tool that actually exists.
      - name: Validate agent definitions
        run: |
          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, ".")
          from services.orchestrator import tools

          failed = False
          for f in sorted(pathlib.Path("agents/definitions").glob("*.json")):
              try:
                  spec = json.loads(f.read_text())
              except json.JSONDecodeError as e:
                  print(f"FAIL {f.name}: invalid JSON: {e}")
                  failed = True
                  continue

              for key in ("name", "model", "instructions"):
                  if not spec.get(key):
                      print(f"FAIL {f.name}: missing '{key}'")
                      failed = True

              if spec.get("name") != f.stem:
                  print(f"FAIL {f.name}: name '{spec.get('name')}' does not match filename")
                  failed = True

              unknown = [t for t in spec.get("tools", []) if t not in tools.SCHEMAS]
              if unknown:
                  print(f"FAIL {f.name}: unknown tools {unknown}")
                  failed = True

              if not failed:
                  print(f"ok   {f.name}  ({len(spec['instructions'])} chars, tools={spec.get('tools', [])})")

          sys.exit(1 if failed else 0)
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build only - no push yet. Catches a broken Dockerfile at PR time rather
      # than at deploy time.
      - name: Build image
        run: docker build -t autoassist:ci .

      - name: Check it starts and answers /health
        run: |
          docker run -d --name ci -p 8000:8000 \
            -e PROJECT_ENDPOINT=https://example.invalid/api/projects/none \
            autoassist:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "healthy after ${i}s"
              curl -s http://localhost:8000/health
              docker rm -f ci
              exit 0
            fi
            sleep 1
          done
          echo "never became healthy:"
          docker logs ci
          docker rm -f ci
          exit 1

  # Evals need Azure, so they cannot run on a pull request from a fork and they
  # cost tokens. This job runs only on main, only when the credentials exist,
  # and only the five-case smoke subset. The full set is run by hand before a
  # release: `make evals`.
  evals:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-service.txt

      - name: Check whether Azure credentials are configured
        id: creds
        run: |
          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Azure credentials not configured - skipping evals."
          fi

      - name: Azure login
        if: steps.creds.outputs.have == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run the smoke evals
        if: steps.creds.outputs.have == 'true'
        env:
          PROJECT_ENDPOINT: ${{ vars.PROJECT_ENDPOINT }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          SEARCH_ENDPOINT: ${{ vars.SEARCH_ENDPOINT }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
        run: python3 evals/run_evals.py --smoke --save

      - name: Keep the results
        if: steps.creds.outputs.have == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
